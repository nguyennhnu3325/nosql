{% extends 'base.html' %}{% block title %}Hồ sơ tài khoản{% endblock %}{% block content %}<section class="card narrow-card"><form id="profile-form"><label for="profile-username">Tên đăng nhập</label><input id="profile-username" readonly value="{{ current_user.username }}"><label for="profile-role">Vai trò</label><input id="profile-role" readonly value="{{ current_user.role }}"><label for="profile-name">Tên hiển thị</label><input id="profile-name" name="displayName" required maxlength="100" value="{{ current_user.displayName }}"><h3 style="margin-top:28px">Đổi mật khẩu</h3><p class="hint">Để trống nếu chỉ cập nhật tên hiển thị.</p><label for="current-password">Mật khẩu hiện tại</label><input id="current-password" name="currentPassword" type="password" autocomplete="current-password" maxlength="128"><label for="new-password">Mật khẩu mới</label><input id="new-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password"><label for="confirm-password">Nhập lại mật khẩu mới</label><input id="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password"><div class="actions"><button>Lưu hồ sơ</button></div></form></section>{% endblock %}{% block scripts %}<script>const form=document.getElementById('profile-form'),profileGuard=watchFormChanges(form);form.onsubmit=async e=>{e.preventDefault();const values=Object.fromEntries(new FormData(form));if(values.password!==document.getElementById('confirm-password').value){message('Mật khẩu xác nhận không khớp.',true);return;}if(!profileGuard.isDirty()){message('Hồ sơ chưa có thay đổi.');return;}if(!await confirmAction({title:values.password?'Đổi mật khẩu?':'Lưu hồ sơ?',message:values.password?'Cập nhật hồ sơ và đổi mật khẩu? Các phiên đăng nhập khác sẽ hết hiệu lực.':'Lưu các thay đổi hồ sơ của bạn?',confirmText:'Lưu thay đổi'}))return;const button=form.querySelector('button');button.disabled=true;try{const user=await api('/api/profile',jsonOptions('PUT',values));document.querySelector('.account-text strong').textContent=user.displayName;document.querySelectorAll('.avatar').forEach(e=>e.textContent=user.displayName.slice(0,1).toUpperCase());for(const id of ['current-password','new-password','confirm-password'])document.getElementById(id).value='';profileGuard.markClean();message('Đã cập nhật hồ sơ.');}catch(error){message(error.message,true);}finally{button.disabled=false;}};</script>{% endblock %}
