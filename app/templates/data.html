{% extends 'base.html' %}{% block title %}Dữ liệu và sao lưu{% endblock %}{% block content %}
<section class="card"><h2>Import / Export dữ liệu giao thông</h2><a class="button secondary" href="/api/admin/traffic/export">↓ Export giao thông JSON</a><form id="traffic-import"><label for="traffic-file">Tệp từ Export giao thông (tối đa 32 MB)</label><input type="file" id="traffic-file" name="file" accept=".json,application/json" required><div class="actions"><button>↑ Import giao thông</button></div></form></section>
<section class="card"><h2>Sao lưu và phục hồi CSDL ứng dụng</h2><button id="db-backup" type="button">＋ Sao lưu CSDL</button><div class="scroll"><table><thead><tr><th>Bản sao lưu</th><th>Dung lượng</th><th>Tải xuống</th></tr></thead><tbody id="db-backups"></tbody></table></div><form id="db-restore"><h3>Phục hồi CSDL</h3><label for="db-name">Bản trên máy chủ</label><select id="db-name" name="name"><option value="">Chọn bản sao lưu...</option></select><label for="db-file">Hoặc tải tệp sao lưu CSDL lên</label><input id="db-file" type="file" name="file" accept=".json,application/json"><label for="db-confirm">Nhập RESTORE để xác nhận</label><input id="db-confirm" name="confirm" required pattern="RESTORE" autocomplete="off"><div class="actions"><button class="danger">Phục hồi CSDL</button></div></form></section>

{% endblock %}{% block scripts %}<script>
const $=id=>document.getElementById(id);for(const id of ['traffic-import','db-restore'])watchFormChanges($(id));let busy=false;function lock(value){busy=value;document.querySelectorAll('main button,main input,main select').forEach(e=>e.disabled=value);}
async function loadBackups(prefix,url){const rows=await api(url),body=$(prefix+'-backups'),select=$(prefix+'-name');body.replaceChildren();select.replaceChildren(new Option('Chọn bản sao lưu...',''));for(const row of rows){const tr=body.insertRow();cell(tr,row.name);cell(tr,(row.size/1024).toFixed(1)+' KB');const a=document.createElement('a');a.href=url+'/'+encodeURIComponent(row.name);a.textContent='Tải JSON';tr.insertCell().append(a);select.add(new Option(row.name,row.name));}if(!rows.length)cell(body.insertRow(),'Chưa có bản sao lưu.').colSpan=3;}
async function refresh(){await loadBackups('db','/api/admin/database/backups');}
async function operation(url,options,form){if(busy)return;lock(true);try{const restoring=url.endsWith('/restore'),importing=url.endsWith('/import');const text=restoring?(url.includes('/database/')?'Phục hồi sẽ thay thế toàn bộ CSDL ứng dụng, gồm tài khoản và cấu hình. Tiếp tục?':'Phục hồi sẽ thay thế toàn bộ dữ liệu giao thông. Tiếp tục?'):importing?'Import sẽ thêm dữ liệu mới và cập nhật các ID đã có. Tiếp tục?':'Tạo bản sao lưu dữ liệu hiện tại?';if(!await confirmAction({title:restoring?'Phục hồi dữ liệu?':importing?'Import dữ liệu?':'Tạo bản sao lưu?',message:text,confirmText:restoring?'Phục hồi':importing?'Import':'Sao lưu',danger:restoring}))return;const result=await api(url,options);message(result.message+(result.backup?' Bản trước thay đổi: '+result.backup:''));form?.reset();await refresh();}catch(e){message(e.message,true);}finally{lock(false);}}
$('db-backup').onclick=()=>operation('/api/admin/database/backups',{method:'POST'});$('traffic-import').onsubmit=e=>{e.preventDefault();const body=new FormData(e.target);operation('/api/admin/traffic/import',{method:'POST',body},e.target);};$('db-restore').onsubmit=e=>{e.preventDefault();const body=new FormData(e.target);if(!body.get('name')&&!body.get('file')?.size){message('Hãy chọn bản sao lưu hoặc tệp JSON.',true);return;}operation('/api/admin/database/restore',{method:'POST',body},e.target);};refresh().catch(e=>message(e.message,true));
</script>{% endblock %}
