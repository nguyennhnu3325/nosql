{% extends 'base.html' %}{% block title %}Quản trị người dùng{% endblock %}{% block content %}

<div class="metrics" id="user-metrics"></div><div class="layout"><section class="card"><h2 id="form-title">Thêm người dùng</h2><form id="user-form">
<label for="username">Tên đăng nhập</label><input id="username" name="username" minlength="3" maxlength="50" pattern="[a-zA-Z0-9_.-]+" required autocomplete="off">
<label for="displayName">Tên hiển thị</label><input id="displayName" name="displayName" maxlength="100" required>
<label for="password">Mật khẩu <small id="password-hint">(ít nhất 8 ký tự)</small></label><input id="password" name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password">
<label for="role">Vai trò</label><select id="role" name="role"><option value="user">Người dùng thường</option><option value="admin">Admin</option></select>
<label><input id="active" name="active" type="checkbox" checked> Đang hoạt động</label>
<div class="actions"><button type="submit" id="save">Thêm người dùng</button><button class="secondary" type="button" id="cancel">Làm mới</button></div></form></section>
<section class="card"><h2>Danh sách tài khoản</h2><label for="search">Tìm kiếm</label><input id="search" type="search" placeholder="Tên, tài khoản hoặc vai trò..."><div class="scroll"><table><thead><tr><th>Người dùng</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="users"></tbody></table></div></section></div>
{% endblock %}{% block scripts %}<script>
const form=document.getElementById('user-form'), tbody=document.getElementById('users');let users=[],editing=null,busy=false;
function setBusy(value){busy=value;form.querySelectorAll('input,select,button').forEach(e=>e.disabled=value);tbody.querySelectorAll('button').forEach(e=>e.disabled=value);}
function resetForm(){editing=null;form.reset();form.elements.password.required=true;document.getElementById('form-title').textContent='Thêm người dùng';document.getElementById('save').textContent='Thêm người dùng';document.getElementById('password-hint').textContent='(ít nhất 8 ký tự)';}
function render(){tbody.replaceChildren();const term=document.getElementById('search').value.toLocaleLowerCase('vi');const shown=users.filter(u=>[u.username,u.displayName,u.role].some(v=>String(v).toLocaleLowerCase('vi').includes(term)));if(!shown.length){const td=cell(tbody.insertRow(),'Không có tài khoản phù hợp.');td.colSpan=4;}for(const u of shown){const tr=tbody.insertRow();const name=cell(tr,u.displayName);const sub=document.createElement('small');sub.textContent=u.username;name.append(sub);tr.insertCell().append(badge(u.role==='admin'?'Admin':'Người dùng',u.role==='admin'?'admin':''));tr.insertCell().append(badge(u.active?'Hoạt động':'Đã khóa',u.active?'success':'danger'));const actions=tr.insertCell();actions.className='row-actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Sửa / phân quyền';edit.disabled=busy;edit.onclick=()=>{editing=u.userId;for(const key of ['username','displayName','role'])form.elements[key].value=u[key];form.elements.active.checked=u.active;form.elements.password.value='';form.elements.password.required=false;document.getElementById('form-title').textContent='Sửa người dùng';document.getElementById('save').textContent='Lưu thay đổi';document.getElementById('password-hint').textContent='(để trống để giữ mật khẩu cũ)';form.elements.username.focus();};const del=document.createElement('button');del.className='danger';del.textContent='Xóa';del.disabled=busy;del.onclick=()=>remove(u);actions.append(edit,del);}}
async function load(){users=await api('/api/admin/users');renderMetrics('user-metrics',[['Tổng tài khoản',users.length],['Quản trị viên',users.filter(u=>u.role==='admin').length],['Đang hoạt động',users.filter(u=>u.active).length],['Đã khóa',users.filter(u=>!u.active).length]]);render();}
form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;setBusy(true);try{const values={username:form.elements.username.value,displayName:form.elements.displayName.value,password:form.elements.password.value,role:form.elements.role.value,active:form.elements.active.checked};await api('/api/admin/users'+(editing?'/'+encodeURIComponent(editing):''),jsonOptions(editing?'PUT':'POST',values));resetForm();message('Đã lưu người dùng.');try{await load();}catch(error){message('Đã lưu; tải lại danh sách thất bại: '+error.message,true);}}catch(error){message(error.message,true);}finally{setBusy(false);}});
async function remove(user){if(busy||!confirm('Xóa tài khoản '+user.username+'?'))return;setBusy(true);try{await api('/api/admin/users/'+encodeURIComponent(user.userId),{method:'DELETE'});if(editing===user.userId)resetForm();message('Đã xóa người dùng.');try{await load();}catch(error){message('Đã xóa; tải lại danh sách thất bại: '+error.message,true);}}catch(error){message(error.message,true);}finally{setBusy(false);}}
document.getElementById('cancel').onclick=()=>{resetForm();message('');};document.getElementById('search').addEventListener('input',render);load().catch(error=>message(error.message,true));
</script>{% endblock %}
